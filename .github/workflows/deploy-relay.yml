# 정보나루 중계(relay/)를 Cloudflare Workers에 올린다 — 행정망에서 Cloudflare 화면이 막혀 있어 배포는 깃허브가 대신 한다.
# 저장소 비밀값(Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare 「My Profile → API Tokens → Edit Cloudflare Workers」 템플릿으로 만든 토큰(이것만 있으면 된다)
#   CLOUDFLARE_ACCOUNT_ID — (선택) 계정 ID. 없으면 토큰으로 계정을 찾고, workers.dev 주소 이름이 없으면 만들어 준다
#   NARU_KEY(또는 NARUKEY) — 이미 있는 정보나루 키. 배포할 때 Cloudflare 비밀값으로 그대로 넘긴다(출력·기록 없음)
# 결과(주소·확인 결과·실패 까닭)는 relay/last_deploy.json 에 남긴다 — 키·토큰은 없다.
name: deploy-relay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["relay/worker.js", "relay/mcp.js", "relay/mcp_data.js", "relay/wrangler.toml", ".github/workflows/deploy-relay.yml"]
permissions:
  contents: write
concurrency:
  group: deploy-relay
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cloudflare에 배포하고 정보나루 키 넘기기
        id: deploy
        continue-on-error: true
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NARU_KEY: ${{ secrets.NARU_KEY || secrets.NARUKEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare 비밀값(CLOUDFLARE_API_TOKEN)이 없어 건너뜁니다"; echo "skipped=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e
          # 계정 ID가 없으면 토큰으로 찾고, workers.dev 주소 이름이 없으면 만든다(휴대폰에서 찾기 어려운 값을 깃허브가 대신 챙김)
          python3 - <<'PY' > prep.out 2> deploy_err.txt
          import json, os, re, urllib.request, urllib.error
          tok = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          raw = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          m = re.search(r"[0-9a-f]{32}", raw)              # 계정 ID 칸에 대시보드 주소 전체를 붙여 넣어도 32자리만 골라 쓴다
          if not m:                                         # 비밀값이 없으면 wrangler.toml의 account_id(비밀 아님)
              m = re.search(r'account_id\s*=\s*"([0-9a-f]{32})"', open("wrangler.toml", encoding="utf-8").read())
          acc = (m.group(1) if m and m.groups() else m.group(0)) if m else ""
          def api(method, path, body=None):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path, method=method,
                                           data=None if body is None else json.dumps(body).encode(),
                                           headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  try: return json.load(e)
                  except Exception: return {"success": False, "errors": [{"message": f"HTTP {e.code}"}]}
          def errs(r): return [e.get("message") for e in r.get("errors", [])]
          v = api("GET", "/user/tokens/verify")
          diag = f"토큰 상태 {(v.get('result') or {}).get('status')} {errs(v)}"
          if not acc:
              ids = [a["id"] for a in (api("GET", "/accounts?per_page=5").get("result") or [])]
              if not ids:
                  ms = api("GET", "/memberships?per_page=5")
                  ids = [m_["account"]["id"] for m_ in (ms.get("result") or []) if m_.get("account")]
                  diag += f" · 멤버십 {len(ids)}건 {errs(ms)}"
              if len(ids) != 1:
                  raise SystemExit(f"계정을 하나로 정하지 못함(찾은 수 {len(ids)}) — {diag}. 계정 ID를 CLOUDFLARE_ACCOUNT_ID 비밀값으로 넣거나(대시보드 주소 전체를 붙여 넣어도 됨), 토큰을 다시 만들 때 「계정 리소스」에서 계정을 고르세요")
              acc = ids[0]
          a = api("GET", f"/accounts/{acc}")                # 계정 설정 읽기 권한이 없는 토큰도 배포는 될 수 있어, 막지 않고 기록만
          if not a.get("success"):
              diag += f" · 계정 정보 읽기 안 됨 {errs(a)}"
          sub = api("GET", f"/accounts/{acc}/workers/subdomain")
          name = (sub.get("result") or {}).get("subdomain")
          if not name:
              r = {}
              for cand in ["altarry", "chaekiji-altarry", "chaekiji-bucheon", "chaekiji-sangdong"]:
                  r = api("PUT", f"/accounts/{acc}/workers/subdomain", {"subdomain": cand})
                  if r.get("success"): name = cand; break
              if not name:
                  raise SystemExit(f"workers.dev 주소 이름을 만들지 못함: {errs(r)} · {diag}. 토큰을 다시 만들 때 「계정 리소스」에서 계정을 고르세요")
          print(acc); print(name)
          PY
          if [ $? -ne 0 ]; then echo "준비 실패"; exit 1; fi
          export CLOUDFLARE_ACCOUNT_ID=$(sed -n 1p prep.out)
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.151.0 deploy > deploy.log 2>&1; rc=$?
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # 실패 까닭 몇 줄만(계정 ID는 가림) — 로그 전체는 남기지 않는다
          grep -E 'ERROR|✘|error' deploy.log | head -5 | sed "s/$CLOUDFLARE_ACCOUNT_ID/***/g" >> deploy_err.txt || true
          if [ $rc -ne 0 ]; then echo "배포 실패"; exit 1; fi
          if [ -n "$NARU_KEY" ]; then
            printf '%s' "$NARU_KEY" | npx --yes wrangler@4.151.0 secret put NARU_KEY > secret.log 2>&1 || { echo "키 넣기 실패" >> deploy_err.txt; exit 1; }
          else echo "정보나루 키 비밀값이 없어 중계가 503을 냅니다" >> deploy_err.txt; fi
      - name: 확인(/health · /holdings · /search · /nation · 원격 상담 비서 /mcp)과 기록
        if: steps.deploy.outputs.skipped != 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          python3 - <<'PY'
          # 배포한 중계에 실제로 물어보고 결과를 relay/last_deploy.json에 남긴다(키·토큰은 오가지도 남지도 않는다).
          # 10/16: 파이썬 기본 이름(Python-urllib)으로 부르면 Cloudflare가 403으로 막는 일이 있어, 이름을 밝혀 부르고
          #        기본 이름 결과는 따로 적는다. 실패하면 상태 번호와 중계가 준 실패 종류(detail)를 남긴다.
          import json, os, time, urllib.request, urllib.error, urllib.parse, datetime, pathlib
          KST = datetime.timezone(datetime.timedelta(hours=9))
          url = os.environ.get("URL") or ""
          rec = {"time": datetime.datetime.now(KST).strftime("%Y-%m-%d %H:%M KST"),
                 "result": "ok" if os.environ.get("OUTCOME") == "success" else "fail", "url": url or None}
          err = pathlib.Path("relay/deploy_err.txt")
          if err.exists() and err.read_text().strip():
              rec["error"] = err.read_text().strip()[:600]
          UA = "chaekiji-relay-check/1.0 (+https://github.com/altarry-prog/chaekiji)"
          def get(path, timeout=30, headers=None, ua=UA):
              h = dict(headers or {})
              if ua: h["User-Agent"] = ua
              t0 = time.time(); out = {}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url + path, headers=h), timeout=timeout) as r:
                      out = {"status": r.status, "json": json.loads(r.read() or b"null"),
                             "acao": r.headers.get("Access-Control-Allow-Origin")}
              except urllib.error.HTTPError as e:
                  text = e.read()[:400].decode("utf-8", "replace")
                  try: out = {"status": e.code, "json": json.loads(text)}
                  except Exception: out = {"status": e.code, "text": " ".join(text.split())[:160]}
              except Exception as e:
                  out = {"status": None, "text": f"{type(e).__name__}: {str(e)[:120]}"}
              out["ms"] = round((time.time() - t0) * 1000)
              return out
          def brief(o, keep=()):
              b = {"status": o.get("status"), "ms": o.get("ms")}
              j = o.get("json") if isinstance(o.get("json"), dict) else {}
              if o.get("status") != 200:
                  b.update({k: j[k] for k in ("error", "detail") if k in j})
                  if "text" in o: b["text"] = o["text"]
              for k in keep:
                  if k in j: b[k] = j[k]
              return b
          if url:
              for i in range(8):                       # 새 주소가 퍼질 때까지 잠깐 기다린다
                  h = get("/health", 20)
                  if h.get("status") == 200: break
                  time.sleep(10)
              rec["health"] = brief(h, ("ok", "keyed", "region"))
              rec["probe_python_default_name"] = brief(get("/health", 20, ua=None))
              c = get("/health", 20, headers={"Origin": "https://altarry-prog.github.io"})
              rec["cors_web"] = {"status": c.get("status"), "allow_origin": c.get("acao")}
              if h.get("status") == 200:
                  o = get("/holdings?isbn=9788972756194", 90)
                  rec["holdings_sample"] = brief(o, ("asof", "calls", "via", "cached"))
                  libs = (o.get("json") or {}).get("libs") if o.get("status") == 200 else None
                  if isinstance(libs, dict):
                      rec["holdings_sample"].update({"isbn": "9788972756194", "ok": sum(v == "ok" for v in libs.values()),
                                                     "busy": sum(v == "busy" for v in libs.values()),
                                                     "none": sum(v == "none" for v in libs.values())})
                  o = get("/search?" + urllib.parse.urlencode({"q": "나미야 잡화점의 기적"}), 60)
                  rec["search_sample"] = brief(o, ("via",))
                  if o.get("status") == 200:
                      docs = (o.get("json") or {}).get("docs") or []
                      rec["search_sample"].update({"docs": len(docs), "first": (docs[0].get("title") if docs else None)})
                  rec["nation_sample"] = brief(get("/nation?isbn=9788972756194", 60), ("found_count", "via"))
                  # 원격 상담 비서(/mcp) — 초기화 → 도구 목록 → 상담 1건(나미야: 오늘 새벽 자료에 있으면 정보나루 호출 0회)
                  def mcp(body, timeout=60):
                      t0 = time.time()
                      req = urllib.request.Request(url + "/mcp", data=json.dumps(body, ensure_ascii=False).encode(), method="POST",
                            headers={"User-Agent": UA, "Content-Type": "application/json", "Accept": "application/json, text/event-stream"})
                      try:
                          with urllib.request.urlopen(req, timeout=timeout) as r:
                              raw = r.read(); return r.status, (json.loads(raw) if raw else None), round((time.time() - t0) * 1000)
                      except urllib.error.HTTPError as e:
                          return e.code, " ".join(e.read()[:200].decode("utf-8", "replace").split()), round((time.time() - t0) * 1000)
                      except Exception as e:
                          return None, f"{type(e).__name__}: {str(e)[:100]}", round((time.time() - t0) * 1000)
                  m = {}
                  st, b, ms = mcp({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18",
                                   "capabilities": {}, "clientInfo": {"name": "deploy-check", "version": "1"}}})
                  res = (b or {}).get("result", {}) if isinstance(b, dict) else {}
                  m["initialize"] = {"status": st, "ms": ms, "protocol": res.get("protocolVersion"), "server": (res.get("serverInfo") or {}).get("version")}
                  st, b, ms = mcp({"jsonrpc": "2.0", "method": "notifications/initialized"})
                  m["initialized"] = {"status": st}
                  st, b, ms = mcp({"jsonrpc": "2.0", "id": 2, "method": "tools/list"})
                  m["tools"] = [t["name"] for t in b["result"]["tools"]] if st == 200 and isinstance(b, dict) else {"status": st, "text": b}
                  st, b, ms = mcp({"jsonrpc": "2.0", "id": 3, "method": "tools/call",
                                   "params": {"name": "consult_request", "arguments": {"utterance": "나미야 잡화점의 기적", "pickup": "상동"}}}, 90)
                  if st == 200 and isinstance(b, dict) and "result" in b:
                      txt = b["result"]["content"][0]["text"]
                      if b["result"].get("isError"):
                          m["consult"] = {"status": st, "ms": ms, "error": txt[:200]}
                      else:
                          o = json.loads(txt); av = o.get("availability") or {}
                          m["consult"] = {"status": st, "ms": ms, "route": o.get("route"), "asof": av.get("asof"),
                                          "basis": av.get("basis"), "notice_head": (o.get("notice") or "")[:70]}
                  else:
                      m["consult"] = {"status": st, "ms": ms, "text": b if not isinstance(b, dict) else b.get("error")}
                  rec["mcp"] = m
              # Cloudflare가 막는 프로그램 이름 확인(/health만 — 정보나루 호출 없음). 원격 상담 비서를 부르는 쪽의 이름이 막히면 연결이 안 된다
              rec["client_name_probe"] = {name: get("/health", 15, ua=name).get("status") for name in
                  ["python-httpx/0.28.1", "python-requests/2.32.3", "node", "undici", "Go-http-client/1.1", "axios/1.7.7",
                   "curl/8.5.0", "Claude-User", "Mozilla/5.0 (compatible; Claude-User/1.0; +Claude-User@anthropic.com)"]}
              good = all((rec.get(k) or {}).get("status") == 200 for k in ("health", "holdings_sample", "search_sample", "nation_sample")) \
                     and ((rec.get("mcp") or {}).get("consult") or {}).get("route") is not None
              rec["check"] = "ok" if good else "fail"
          pathlib.Path("relay/last_deploy.json").write_text(json.dumps(rec, ensure_ascii=False, indent=1), encoding="utf-8")
          print(json.dumps(rec, ensure_ascii=False))
          PY
          git config user.name "chaekiji-relay-deploy"
          git config user.email "relay@users.noreply.github.com"
          git add relay/last_deploy.json
          if ! git diff --cached --quiet; then git commit -m "중계 배포 기록 $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M')" && git pull --rebase -q origin main && git push; fi
      - name: 배포가 실패했으면 빨간 X로 알리기
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "중계 배포 실패 — relay/last_deploy.json 에 까닭이 있습니다"
          exit 1
