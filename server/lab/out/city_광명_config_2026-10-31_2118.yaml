# 규정 값: 아래 「확인한 값」 말고는 부천 값을 자리표시로 둔 【확인】 — 그 도시 누리집 규정으로 바꿔야 운영에 쓸 수 있다
# 확인한 값 hold_days=3: 광명시 공식 블로그(2023. 3.) 「도서 수령 문자를 받고 3일 이내에 대출」
# 확인한 값 total_limit=7: 기호일보 기사 「기존 대출 권수인 7권」(시점 확인 필요)
