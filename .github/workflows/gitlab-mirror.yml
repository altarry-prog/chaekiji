# 공공 깃랩 자동 반영 — 깃허브 main에 올라온 내용을 공공 깃랩(altarry/chaekiji)의 main으로 그대로 밀어 올린다.
# 깃랩 열쇠(프로젝트 액세스 토큰)는 깃허브 저장소 비밀값 GITLAB_TOKEN에만 둔다(코드·문서·채팅 금지).
# 열쇠가 아직 없으면 「깃랩에 닿는지」만 확인하고 끝난다(실패 아님).
# 강제 덮어쓰기는 하지 않는다 — 깃랩 쪽에 다른 커밋이 있으면 빨강으로 멈추고 사람이 확인한다.
# 11/8 18:00 동결 뒤에는 이 파일의 push·schedule 줄을 지워 자동 반영을 멈춘다(제출용 새 프로젝트는 11/9 별도로 가져오기).
name: gitlab-mirror
# 10/22 확인: 깃허브 실행기(해외)에서 공공 깃랩 443 포트에 연결되지 않음(135초 뒤 연결 실패) — 그래서 자동 실행은 끄고 손으로만 돌린다.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gitlab-mirror
  cancel-in-progress: false
env:
  GL_HOST: gitlab.aigov.go.kr
  GL_PATH: altarry/chaekiji
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 깃랩에 닿는지 확인
        run: |
          code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "https://$GL_HOST/api/v4/projects/${GL_PATH//\//%2F}" || true)
          echo "깃랩 응답: $code" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$code" ] || [ "$code" = "000" ]; then echo "::error::깃허브에서 공공 깃랩에 닿지 않습니다(망 차단 추정)"; exit 1; fi
      - name: 깃랩 main으로 밀어 올리기
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "열쇠(GITLAB_TOKEN)가 아직 없어 확인만 하고 끝냅니다." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@${GL_HOST}/${GL_PATH}.git"
          # 진단: 열쇠로 읽을 수 있는지, 깃랩 main이 깃허브 이력 안에 있는지(로그 본문 대신 알림 줄로 남긴다)
          if ! remote=$(git ls-remote gitlab refs/heads/main 2>&1 | sed "s/${GITLAB_TOKEN}/***/g"); then
            echo "::error::열쇠로 깃랩을 읽지 못함: $(echo "$remote" | tail -1)"; exit 1; fi
          rsha=$(echo "$remote" | awk '{print $1}')
          if [ -z "$rsha" ]; then echo "::notice::깃랩 main이 비어 있음 — 처음 올림"
          elif git merge-base --is-ancestor "$rsha" HEAD 2>/dev/null; then echo "::notice::깃랩 main ${rsha:0:8}은 깃허브 이력 안에 있음 — 이어 올리기 가능"
          else echo "::warning::깃랩 main ${rsha:0:8}이 깃허브 이력에 없음(깃랩에만 있는 커밋) — 덮어쓰지 않음"; fi
          if git push gitlab HEAD:refs/heads/main 2>err.txt; then
            echo "반영 완료: $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::notice::반영 완료 $(git rev-parse --short HEAD)"
          else
            msg=$(sed "s/${GITLAB_TOKEN}/***/g" err.txt | grep -v '^To ' | tr '\n' ' ' | cut -c1-400)
            echo "::error::깃랩이 받아 주지 않음: $msg"
            exit 1
          fi
