# 정보나루 키 확인(수동 실행) — 깃허브 비밀값에 든 정보나루 키들이 서로 다른 키인지, 각각 쓸 수 있는지를 한 번씩만 불러 본다.
# 키 값은 어디에도 찍지 않는다(같은지 여부와 결과 종류만). 정보나루 호출은 키마다 1번(서지 검색 1건)이다.
name: naru-keys-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 키마다 한 번씩 불러 보기
        env:
          K_NARU_KEY: ${{ secrets.NARU_KEY }}
          K_NARUKEY: ${{ secrets.NARUKEY }}
          K_NARU_KEY_REFRESH: ${{ secrets.NARU_KEY_REFRESH }}
          K_NARU_KEY_ASK: ${{ secrets.NARU_KEY_ASK }}
          ALL_SECRETS: ${{ toJSON(secrets) }}          # 이름만 읽는다(값은 찍지 않음). 정보나루 키를 다른 이름으로 넣었을 때 찾으려고
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse
          allsec = json.loads(os.environ.get("ALL_SECRETS") or "{}")
          other = ("CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "UPSTAGE_API_KEY", "github_token", "GITHUB_TOKEN")
          print("저장소 비밀값 이름:", ", ".join(sorted(allsec)))
          names = ["NARU_KEY", "NARUKEY", "NARU_KEY_REFRESH", "NARU_KEY_ASK"]
          names += sorted(n for n in allsec if n not in names and n not in other)   # 그 밖의 이름도 정보나루 키인지 한 번씩
          keys = {n: str(allsec.get(n) or os.environ.get("K_" + n, "")).strip() for n in names}
          seen = {}
          rows = []
          for n in names:
              k = keys[n]
              if not k:
                  rows.append(f"| {n} | 없음 | - | - |"); continue
              same = [m for m in seen if seen[m] == k]
              seen[n] = k
              if same:
                  rows.append(f"| {n} | 있음 | {same[0]}와 같은 키 | (다시 부르지 않음) |"); continue
              q = urllib.parse.urlencode({"authKey": k, "title": "나미야 잡화점의 기적", "pageSize": 1, "format": "json"})
              res = "?"
              for base in ("http://data4library.kr/api/", "https://data4library.kr/api/"):
                  try:
                      req = urllib.request.Request(base + "srchBooks?" + q, headers={"User-Agent": "chaekiji-key-check/1.0"})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          d = json.load(r)
                      resp = d.get("response") or d
                      if resp.get("error"):
                          res = "오류: " + str(resp["error"]).replace(k, "***")[:80]
                      else:
                          res = f"정상(검색 결과 {len(resp.get('docs') or [])}건)"
                      break
                  except Exception as e:
                      res = f"연결 실패({type(e).__name__})"
              rows.append(f"| {n} | 있음 | 앞의 이름들과 다른 키 | {res} |")
          out = ["| 비밀값 이름 | 값 | 다른 이름과 견줌 | 한 번 불러 본 결과 |", "|---|---|---|---|"] + rows
          print("\n".join(out))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## 정보나루 키 확인\n\n저장소 비밀값 이름: " + ", ".join(sorted(allsec)) + "\n\n" + "\n".join(out) + "\n\n키 값은 적지 않았다(같은 키인지와 불러 본 결과만).\n")
          PY
