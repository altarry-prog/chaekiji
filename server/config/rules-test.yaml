# [10/18] 엔진 시험 전용 설정 — 실제 도시 규정이 아니다.
# 부천 설정(bucheon.yaml)을 누리집 안내에 맞추며 제외 자료(DVD·참고자료)·신착 제외가 빠졌다.
# 「설정에 적힌 제외 규정을 엔진이 그대로 막는가」를 보는 적합성 시험 ㉒·㉓은 이 파일로 돈다(판정 기준·건수 그대로).
# 이 두 줄 말고는 bucheon.yaml과 같다.
# 책이지 MCP — 부천시립도서관 설정
# 지역 고유값은 전부 이 파일에 산다. 코드에는 한 글자도 없다.
city: 부천
region_code: "31050"          # 정보나루 세부지역 코드 (행정표준코드 아님)
home_library: 상동
libraries:
  꿈빛: "141065"
  꿈여울: "141248"
  도당: "141583"
  동화: "141315"
  별빛마루: "141652"
  북부: "141056"
  상동: "141321"
  송내: "141559"
  수주: "141651"
  심곡: "141043"
  역곡: "141603"
  역곡밝은: "141660"
  오정: "141584"
  원미: "141535"
  책마루: "141115"
  한울빛: "141151"
# [10/18] 규정값 출처 — 부천시립도서관 누리집 「부천시립도서관상호대차」 안내(최종수정 2026. 8. 10., 담당 별빛마루도서관).
#   담당자가 2026. 10. 18. 화면을 보내 대조함(누리집은 외부 자동 열람이 막혀 있음). 안내에 없는 것은 「창구 확인」으로 둔다.
rules:
  ill_limit: 5                # 상호대차 1인 한도 — 누리집 「신청권수 1인 통합 5권」
  total_limit: 20             # 시 통합 대출 한도 — 누리집 「통합 대출권수 20권」
  per_lib_limit: 5            # 도서관별 한도(직접+상호대차 합산) — 누리집 「상호대차 대출 도서라도 각 도서관별 대출권수 5권 한도에 포함」
  block_if_pickup_on_shelf: true   # 수령관 동일도서 비치 시 신청 불가 — 누리집 「대출받을 도서관에 동일도서가 비치 중인 경우 신청할 수 없음」
  block_if_overdue: true      # [v0.3] 연체·정지 회원 신청 불가 — 누리집 「연체로 인해 대출정지 된 경우」 신청 불가
  excluded_types: [DVD, 참고자료]   # 시험용 — 유형 제외 규정이 설정대로 막는지(엔진 시험 ㉓)
  exclude_new_arrival: true   # 시험용 — 신착 제외 규정이 설정대로 막는지(엔진 시험 ㉒)
ill_eta_days: "1"             # [10/18] 누리집 「도서도착 소요시간 1일(주말/공휴일 및 휴관일 제외)」(이전 "2~3")
ill_eta_text: "월~목요일 신청은 다음 날, 금·토요일 신청은 월·화요일에"   # [10/18] 안내문 문장 — 누리집 「신청 요일별 도착일」
hold_days: 3                  # 도착 후 보관 기한(일) — 누리집 「도착일 포함 3일이 지나면 자동반납」(10/18 확정, 이전 예시값)
hold_includes_arrival_day: true   # [10/18] 「도착한 날을 포함해 3일」로 안내
no_pickup_block_days: 7       # [10/18] 누리집 「자동반납 1회 시 7일간 상호대차 도서 신청 불가」 — 안내문에 고지(판정 규칙은 v0.4)
reserve_converts_to_ill: true # [10/18] 누리집 「예약한 도서가 반납되면 상호대차로 전환 신청 가능」 — 「예약 권장」 안내문에 고지
pass:                          # 책이지 패스(구독 자동화) 위임 기본 범위
  max_per_cycle: 3            # 월 최대 권수
  free_routes_only: true      # 무료 경로(관내)만 자동 실행
relay_url: "https://chaekiji-relay.altarry2.workers.dev"   # [v0.3.4] 정보나루 중계(relay/) 주소 — 2026-10-16 Cloudflare Workers 첫 배포(깃허브 액션 deploy-relay.yml, 확인 기록 relay/last_deploy.json). auto 모드에서 중계가 답하면 오늘 데이터, 안 되면 매일 갱신 스냅샷 → 8/18 픽스처. 비우면 중계를 쓰지 않는다. 환경변수 CHAEKIJI_RELAY가 우선. 키 값은 여기 없다(중계 서버만 가짐)
official_search_url: "https://alpasq.bcl.go.kr/search/keyword/{title}"   # [v0.3.4] 공식 자료검색 주소 틀 — {title} 또는 {isbn13}이 채워져 안내문 끝에 「공식 누리집에서 이 책 보기」 링크로 붙는다(접수는 이용자가 로그인해 직접). 비우면 생략. 검색어가 주소에 들어감은 2026-10-16 확인
sso: sso.bucheon.go.kr
notify_channels: [sms, voice_call]
