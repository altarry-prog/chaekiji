# GPT 모델 구동 실측: 깃허브 모델(GitHub Models, 무료 시험용)로 오픈AI GPT 모델에 책이지 상담 도구를 붙여,
# 공개 모델 2종 노트북과 같은 문의 5건을 돌리고 기록표를 만든다(tools/model2/run_gpt.py).
# 왜: ChatGPT 커넥터는 유료 요금제에서만 열려(2026. 10. 30. 확인), 결제·인증키 없이 GPT 계열에서도 같은 판정이 나오는지
#     기록하려고(담당자 10. 30. 16:15 승인). main은 건드리지 않고 기록은 이 가지(tools/model2)의 server/lab/out/에 커밋한다.
# 인증: 깃허브 액션 기본 토큰(GITHUB_TOKEN)에 models: read 권한만 더한다. 인증키·결제 없음.
# 정보나루: 원격 중계를 거쳐 오늘 자료 — 새벽 자료에 있는 책은 호출 0, 없는 책(채식주의자)만 한 번(약 17건, 10분 캐시).
name: model-gpt
on:
  workflow_dispatch:
  push:
    branches: [tools/model2]
    paths: [".github/workflows/model-gpt.yml", "tools/model2/gpt_host.py", "tools/model2/run_gpt.py"]
permissions:
  contents: write
  models: read
concurrency:
  group: model-gpt
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 작업 폴더(공개 모델 실측과 같은 /content)
        run: sudo mkdir -p /content && sudo chown "$USER" /content
      - name: 연결 진단(10. 30. 2~4차가 200 「OK」만 받음 — 응답 머리글과 앞부분을 기록에 남김, 토큰은 찍지 않음)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=/content/gpt_probe_actions_${GITHUB_RUN_ID}.txt
          body='{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"hi"}]}'
          {
            echo "# 연결 진단 $(date -u +%FT%TZ) · run ${GITHUB_RUN_ID}"
            echo "## 프록시 변수(값은 주소만)"; env | grep -i -E '^(https?|no)_proxy=' || echo "(없음)"
            echo "## 이름 풀이"; getent hosts models.github.ai || echo "(실패)"; getent hosts models.inference.ai.azure.com || echo "(실패)"
            echo "## 1. 카탈로그 GET(인증 없음)"; curl -sS -m 30 -D - -o /tmp/b1 https://models.github.ai/catalog/models; head -c 300 /tmp/b1; echo
            echo "## 2. 추론 POST(현재 판 머리글)"; curl -sS -m 60 -D - -o /tmp/b2 -X POST https://models.github.ai/inference/chat/completions -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10" -H "Content-Type: application/json" -d "$body"; head -c 400 /tmp/b2; echo
            echo "## 3. 추론 POST(-L 넘겨주기 따라감)"; curl -sS -L -m 60 -D - -o /tmp/b3 -X POST https://models.github.ai/inference/chat/completions -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Content-Type: application/json" -d "$body"; head -c 400 /tmp/b3; echo
            echo "## 4. 옛 주소(azure) POST"; curl -sS -m 60 -D - -o /tmp/b4 -X POST https://models.inference.ai.azure.com/chat/completions -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Content-Type: application/json" -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"hi"}]}'; head -c 400 /tmp/b4; echo
          } > "$out" 2>&1
          sed -i "s/${GITHUB_TOKEN}/***/g" "$out"
          cat "$out"
      - name: GPT 모델 × 같은 문의 5건(깃허브 모델)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/model2/run_gpt.py
      - name: 기록을 이 가지에 커밋
        if: always()
        run: |
          mkdir -p server/lab/out
          cp /content/chaekiji/server/lab/out/model_gpt_record_actions_*.md server/lab/out/ 2>/dev/null || true
          cp /content/chaekiji/server/lab/out/gpt_host_log_actions_*.ndjson server/lab/out/ 2>/dev/null || true
          cp /content/chaekiji/server/lab/out/gpt_host_answers_actions_*.ndjson server/lab/out/ 2>/dev/null || true
          cp /content/gpt_probe_actions_*.txt server/lab/out/ 2>/dev/null || true
          ls -la server/lab/out | grep gpt || echo "기록 파일 없음"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/lab/out
          git commit -m "GPT 모델 구동 실측 기록 — 깃허브 액션·깃허브 모델(${RUN_URL##*/})" || echo "커밋할 것 없음"
          git pull --rebase -q origin tools/model2 || true
          git push
