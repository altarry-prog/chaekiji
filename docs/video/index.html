<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>책이지 시연영상</title>
<style>
:root{--bg:#f4f7f5;--fg:#1d2421;--sub:#46524c;--acc:#1b5a4b;--card:#ffffff;--line:#d3ddd8}
@media (prefers-color-scheme:dark){:root{--bg:#111513;--fg:#e7eeea;--sub:#a8b6af;--acc:#86d3bd;--card:#1a201d;--line:#2d3732}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.2rem;margin:4px 0 10px}
h1 small{font-weight:400;color:var(--sub);font-size:.9rem}
.vbox{position:relative;background:#000;border-radius:10px;overflow:hidden}
video{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#000}
.ctl{margin:10px 0 0}
#snd{border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;background:var(--acc);color:var(--bg);cursor:pointer;white-space:nowrap}
#snd:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.card p{margin:.3em 0;color:var(--sub);font-size:.94rem}
.card b{color:var(--fg)}
a{color:var(--acc)}
ul{margin:.4em 0 0;padding-left:1.2em;color:var(--sub);font-size:.94rem}
</style>
</head>
<body>
<main>
<h1>책이지 시연영상 <small>(4분 59초 · 2026. 11. 3.)</small></h1>
<div class="vbox">
  <video id="v" controls autoplay muted playsinline preload="auto" poster="frame.jpg">
    <source src="chaekiji-demo-720p.mp4" type="video/mp4">
    이 브라우저에서는 영상을 재생할 수 없습니다. <a href="chaekiji-demo-720p.mp4">영상 파일 열기</a>
  </video>
</div>
<p class="ctl"><button id="snd" type="button">🔊 소리 켜기(음성 해설)</button></p>
<div class="card">
  <p><b>처음에는 소리 없이 재생됩니다.</b> 「소리 켜기」를 누르면 음성 해설이 나옵니다(AI 합성, MeloTTS).</p>
  <p>화면은 실제 화면 녹화입니다. 시연 모델이라 신청은 실제 접수로 이어지지 않고, 대출 상태는 도서관 정보나루 조회일 전일 기준입니다.</p>
  <ul>
    <li><a href="https://github.com/altarry-prog/chaekiji/blob/main/docs/%EC%8B%9C%EC%97%B0%EC%98%81%EC%83%81-%EA%B5%AC%EC%84%B1%ED%91%9C.md">장면 구성표</a> · <a href="https://github.com/altarry-prog/chaekiji/blob/main/docs/%EC%8B%9C%EC%97%B0%EC%98%81%EC%83%81-%EC%9E%90%EB%A7%89.srt">화면 글 자막(SRT)</a></li>
    <li>직접 써 보기: <a href="../../">시연 웹(시민 음성 화면)</a> · <a href="https://github.com/altarry-prog/chaekiji">저장소</a></li>
  </ul>
</div>
</main>
<script>
(function(){
  var v=document.getElementById('v'), b=document.getElementById('snd');
  function hide(){ b.hidden=true; }
  b.addEventListener('click', function(){ v.muted=false; v.volume=1; var p=v.play(); if(p&&p.catch){p.catch(function(){});} hide(); v.focus(); });
  v.addEventListener('volumechange', function(){ if(!v.muted){ hide(); } });
})();
</script>
</body>
</html>
