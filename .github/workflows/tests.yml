# GitHub Actions — 커밋할 때마다 참조 서버(server/)의 시험 85건(적합성 48·실험실 14·중계 모드 17·호스트 6)과
# 중계·원격 상담 비서(relay/) 점검(중계 서버 19 · 원격 상담 비서 26 · 파이썬 판 대조 18)을 자동 실행(공개 저장소는 무료).
# 결과는 저장소 Actions 탭과 README 배지로 보인다:
#   ![tests](https://github.com/altarry-prog/chaekiji/actions/workflows/tests.yml/badge.svg)
name: tests
on:
  push:
    branches: [main]
    paths: ["server/**", "relay/**", "!server/fixtures/holdings-today.json", "!relay/last_deploy.json", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["server/**", "relay/**"]
jobs:
  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 적합성 시험 48건 (demo 모드 · 네트워크 없음)
        run: python3 tests/run_scenarios.py
      - name: 실험실 점검 14건 (저장·감사·관내 출처)
        run: python3 lab/check_store.py
      - name: 중계 모드 시험 17건 (모의 중계)
        run: python3 tests/run_relay.py
      - name: 공개 모델 호스트 시험 6건 (모의 Ollama)
        run: python3 tests/run_host.py
      - name: 중계 코드(worker.js) 점검 19건 (모의 정보나루)
        run: node ../relay/test_worker.mjs
      - name: 원격 상담 비서(/mcp) 점검 26건 (모의 정보나루)
        run: node ../relay/test_mcp.mjs
      - name: 원격 상담 비서 ↔ 파이썬 판 대조 18건 (같은 입력 → 같은 판정·안내문)
        run: python3 ../relay/test_mcp_parity.py
      - name: 원격 상담 비서 자료 파일이 server/ 원본과 같은지
        run: python3 ../relay/build_mcp_data.py --check
      - name: 측정 스크립트 연습 실행 (픽스처)
        run: python3 lab/measure.py --demo
