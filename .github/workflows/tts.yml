# 시연영상 음성(내레이션) 만들기 — 가지 tools/video 전용(제출 산출물 아님)
# MeloTTS(MIT 라이선스, 상업·비상업 모두 무료 — https://github.com/myshell-ai/MeloTTS)의 한국어 모델로
# tools/video/narration/script/*.txt(장면별 원고)를 읽어 mp3를 만들고(보통 속도 — 담당자 10. 20. 선택),
# 장면마다 3번 만들어 음성 인식(faster-whisper, MIT)으로 다시 받아쓰고, 원고와 가장 같게 들린 것을 골라 tools/video/narration/audio/script/ 에 올린다.
# 첫 샘플(tools/video/narration/sample_01_opening.txt → audio/)은 다시 만들지 않는다.
# 계정·인증키가 필요 없고, 정보나루를 부르지 않는다.
name: tts-narration
on:
  push:
    branches: [tools/video]
    paths: ["tools/video/narration/script/*.txt", "tools/video/tts_melo.py", "tools/video/pick_best.py", ".github/workflows/tts.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "다시 만들 장면 원고 이름(쉼표로, 예: 10_설치형). 비우면 모두"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tools/video
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # [11. 2.] 원고를 고친 장면만 다시 만든다(나머지 장면 음성과 길이는 그대로 → 영상 5분 안 유지).
      # push면 이번에 바뀐 원고만, 수동 실행이면 only에 적은 장면만, 둘 다 없으면 예전처럼 모두.
      - name: 다시 만들 장면 정하기
        env:
          ONLY_IN: ${{ github.event.inputs.only }}
          BEFORE: ${{ github.event.before }}
        run: |
          S=tools/video/narration/script
          ONLY="$ONLY_IN"
          if [ "${{ github.event_name }}" = "push" ] && [ -z "$ONLY" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            ONLY=$(git -c core.quotePath=false diff --name-only "$BEFORE" HEAD -- "$S" | grep '\.txt$' | xargs -r -n1 basename | sed 's/\.txt$//' | paste -sd, -)
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ -z "$ONLY" ]; then
            echo "SKIP=1" >> "$GITHUB_ENV"; echo "원고가 바뀌지 않아 음성을 다시 만들지 않습니다"; exit 0
          fi
          echo "ONLY=$ONLY" >> "$GITHUB_ENV"
          echo "다시 만들 장면: ${ONLY:-모두}"
      - name: MeloTTS 설치
        if: env.SKIP != '1'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q git+https://github.com/myshell-ai/MeloTTS.git
          python -m unidic download
      - name: 음성 만들기(장면마다 3번)
        if: env.SKIP != '1'
        env:
          SPEEDS: "1.0"
          TAKES: "3"
        run: |
          S=tools/video/narration/script; O=tools/video/narration/audio/script
          if [ -n "$ONLY" ]; then
            rm -rf /tmp/only_s /tmp/only_o && mkdir -p /tmp/only_s /tmp/only_o
            for n in $(echo "$ONLY" | tr ',' ' '); do cp "$S/$n.txt" /tmp/only_s/; done
            python tools/video/tts_melo.py /tmp/only_s /tmp/only_o
          else
            rm -rf "$O"
            python tools/video/tts_melo.py "$S" "$O"
          fi
      - name: 받아쓰기 점검(따로 둔 환경)
        if: env.SKIP != '1'
        run: |
          python -m venv /tmp/asr
          /tmp/asr/bin/pip install -q faster-whisper==1.2.1 requests
          if [ -n "$ONLY" ]; then
            /tmp/asr/bin/python tools/video/asr_check.py /tmp/only_s /tmp/only_o
          else
            /tmp/asr/bin/python tools/video/asr_check.py tools/video/narration/script tools/video/narration/audio/script
          fi
      - name: 가장 또렷한 것 고르기 + 전체 이어듣기
        if: env.SKIP != '1'
        run: |
          O=tools/video/narration/audio/script
          if [ -n "$ONLY" ]; then
            python3 tools/video/pick_best.py /tmp/only_o
            python3 tools/video/merge_partial.py /tmp/only_o "$O"
          else
            python3 tools/video/pick_best.py "$O"
          fi
      - name: 결과 올리기
        if: env.SKIP != '1'
        run: |
          git config user.name "chaekiji-tts"
          git config user.email "tts@users.noreply.github.com"
          git add -A tools/video/narration/audio/script
          git diff --cached --quiet && exit 0
          git commit -q -m "내레이션 음성(MeloTTS 한국어, 보통 속도)·받아쓰기 점검 $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M')"
          git pull --rebase -q || true
          git push -q
