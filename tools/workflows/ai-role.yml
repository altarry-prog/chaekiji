# AI가 맡는 몫 반복 실측: 제목 없이 한 말·오타·외국어 5종·모호한 말 10건을 GPT-OSS(gpt-oss:20b, 공개 모델)로 두 번씩 돌려
# 모델이 말을 책으로 바꾸고 안내문을 옮기는지, 도구가 정한 판정·조회일·주소를 바꾸지 않는지 기계로 채점한다(tools/model2/run_ai_role.py).
# 담당자 10. 31. 21:00 「AI가 맡는 몫 반복 실측」 요청. main은 건드리지 않고 기록은 이 가지(tools/model2)의 server/lab/out/에 커밋한다.
# 인증키·결제 없음. 정보나루: 시연 도서는 그날 새벽 자료(호출 0), 채식주의자만 중계로 한 번(10분 캐시).
name: ai-role
on:
  workflow_dispatch:
  push:
    branches: [tools/model2]
    paths: [".github/workflows/ai-role.yml", "tools/model2/run_ai_role.py"]
permissions:
  contents: write
concurrency:
  group: ai-role
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      AI_ROLE_REPEATS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 디스크 비우기(모델 약 14GB) · 서버 사양
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1; free -h | head -2; nproc
          sudo mkdir -p /content && sudo chown "$USER" /content
      - name: Ollama 설치·시작, gpt-oss:20b 받기
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -s http://127.0.0.1:11434/api/version > /dev/null; then (ollama serve > /content/ollama_serve.log 2>&1 &); fi
          for i in $(seq 1 90); do curl -s http://127.0.0.1:11434/api/version && break; sleep 1; done
          echo; time ollama pull gpt-oss:20b > /dev/null 2>&1
          ollama list
      - name: 문의 10건 × 2회
        run: python3 tools/model2/run_ai_role.py
      - name: 기록을 이 가지에 커밋
        if: always()
        run: |
          mkdir -p server/lab/out
          cp /content/chaekiji/server/lab/out/ai_role_* server/lab/out/ 2>/dev/null || true
          ls -la server/lab/out | grep ai_role || echo "기록 파일 없음"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/lab/out
          git commit -m "AI가 맡는 몫 반복 실측 기록 — 깃허브 액션(${RUN_URL##*/})" || echo "커밋할 것 없음"
          git pull --rebase -q origin tools/model2 || true
          git push
