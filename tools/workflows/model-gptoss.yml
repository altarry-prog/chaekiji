# GPT-OSS 구동 실측: 오픈AI가 공개한 내려받는 모델 GPT-OSS(gpt-oss:20b)를 깃허브 액션 서버(CPU)의 Ollama로 돌려,
# 공개 모델 2종 노트북과 같은 문의 5건을 처리하고 기록표를 만든다(tools/model2/run_gptoss.py).
# 왜: 깃허브 모델(GitHub Models)이 2026. 7. 30. 종료되어 결제 없이 GPT 계열을 잴 길이 공개 모델뿐이다. GPT-OSS는 행정안전부
#     AI 공통기반 목록(참가 안내서 10. 21. 변경판)에 있다(담당자 10. 30. 16:15 승인한 「무료로 GPT 실측」의 대안).
# main은 건드리지 않고 기록은 이 가지(tools/model2)의 server/lab/out/에 커밋한다. 인증키·결제 없음.
# 정보나루: 원격 중계를 거쳐 오늘 자료 — 새벽 자료에 있는 책은 호출 0, 없는 책(채식주의자)만 한 번(약 17건, 10분 캐시).
name: model-gptoss
on:
  workflow_dispatch:
  push:
    branches: [tools/model2]
    paths: [".github/workflows/model-gptoss.yml", "tools/model2/run_gptoss.py"]
permissions:
  contents: write
concurrency:
  group: model-gptoss
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 디스크 비우기(모델 약 14GB) · 서버 사양
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1; free -h | head -2; nproc
          sudo mkdir -p /content && sudo chown "$USER" /content
      - name: Ollama 설치·시작, gpt-oss:20b 받기
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -s http://127.0.0.1:11434/api/version > /dev/null; then (ollama serve > /content/ollama_serve.log 2>&1 &); fi
          for i in $(seq 1 90); do curl -s http://127.0.0.1:11434/api/version && break; sleep 1; done
          echo; time ollama pull gpt-oss:20b > /dev/null 2>&1
          ollama list
      - name: GPT-OSS × 같은 문의 5건
        run: python3 tools/model2/run_gptoss.py
      - name: 기록을 이 가지에 커밋
        if: always()
        run: |
          mkdir -p server/lab/out
          cp /content/chaekiji/server/lab/out/model_gptoss_record_actions_*.md server/lab/out/ 2>/dev/null || true
          cp /content/chaekiji/server/lab/out/gptoss_host_log_actions_*.ndjson server/lab/out/ 2>/dev/null || true
          cp /content/chaekiji/server/lab/out/gptoss_host_answers_actions_*.ndjson server/lab/out/ 2>/dev/null || true
          ls -la server/lab/out | grep gptoss || echo "기록 파일 없음"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/lab/out
          git commit -m "GPT-OSS 구동 실측 기록 — 깃허브 액션(${RUN_URL##*/})" || echo "커밋할 것 없음"
          git pull --rebase -q origin tools/model2 || true
          git push
