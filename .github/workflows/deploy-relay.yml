# 정보나루 중계(relay/)를 Cloudflare Workers에 올린다 — 행정망에서 Cloudflare 화면이 막혀 있어 배포는 깃허브가 대신 한다.
# 저장소 비밀값(Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare 「My Profile → API Tokens → Edit Cloudflare Workers」 템플릿으로 만든 토큰(이것만 있으면 된다)
#   CLOUDFLARE_ACCOUNT_ID — (선택) 계정 ID. 없으면 토큰으로 계정을 찾고, workers.dev 주소 이름이 없으면 만들어 준다
#   NARU_KEY(또는 NARUKEY) — 이미 있는 정보나루 키. 배포할 때 Cloudflare 비밀값으로 그대로 넘긴다(출력·기록 없음)
# 결과(주소·확인 결과·실패 까닭)는 relay/last_deploy.json 에 남긴다 — 키·토큰은 없다.
name: deploy-relay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["relay/worker.js", "relay/wrangler.toml", ".github/workflows/deploy-relay.yml"]
permissions:
  contents: write
concurrency:
  group: deploy-relay
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cloudflare에 배포하고 정보나루 키 넘기기
        id: deploy
        continue-on-error: true
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NARU_KEY: ${{ secrets.NARU_KEY || secrets.NARUKEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare 비밀값(CLOUDFLARE_API_TOKEN)이 없어 건너뜁니다"; echo "skipped=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e
          # 계정 ID가 없으면 토큰으로 찾고, workers.dev 주소 이름이 없으면 만든다(휴대폰에서 찾기 어려운 값을 깃허브가 대신 챙김)
          python3 - <<'PY' > prep.out 2> deploy_err.txt
          import json, os, re, urllib.request, urllib.error
          tok = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          raw = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          m = re.search(r"[0-9a-f]{32}", raw)              # 계정 ID 칸에 대시보드 주소 전체를 붙여 넣어도 32자리만 골라 쓴다
          acc = m.group(0) if m else ""
          def api(method, path, body=None):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path, method=method,
                                           data=None if body is None else json.dumps(body).encode(),
                                           headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  try: return json.load(e)
                  except Exception: return {"success": False, "errors": [{"message": f"HTTP {e.code}"}]}
          def errs(r): return [e.get("message") for e in r.get("errors", [])]
          v = api("GET", "/user/tokens/verify")
          diag = f"토큰 상태 {(v.get('result') or {}).get('status')} {errs(v)}"
          if not acc:
              ids = [a["id"] for a in (api("GET", "/accounts?per_page=5").get("result") or [])]
              if not ids:
                  ms = api("GET", "/memberships?per_page=5")
                  ids = [m_["account"]["id"] for m_ in (ms.get("result") or []) if m_.get("account")]
                  diag += f" · 멤버십 {len(ids)}건 {errs(ms)}"
              if len(ids) != 1:
                  raise SystemExit(f"계정을 하나로 정하지 못함(찾은 수 {len(ids)}) — {diag}. 계정 ID를 CLOUDFLARE_ACCOUNT_ID 비밀값으로 넣거나(대시보드 주소 전체를 붙여 넣어도 됨), 토큰을 다시 만들 때 「계정 리소스」에서 계정을 고르세요")
              acc = ids[0]
          a = api("GET", f"/accounts/{acc}")                # 계정 설정 읽기 권한이 없는 토큰도 배포는 될 수 있어, 막지 않고 기록만
          if not a.get("success"):
              diag += f" · 계정 정보 읽기 안 됨 {errs(a)}"
          sub = api("GET", f"/accounts/{acc}/workers/subdomain")
          name = (sub.get("result") or {}).get("subdomain")
          if not name:
              r = {}
              for cand in ["altarry", "chaekiji-altarry", "chaekiji-bucheon", "chaekiji-sangdong"]:
                  r = api("PUT", f"/accounts/{acc}/workers/subdomain", {"subdomain": cand})
                  if r.get("success"): name = cand; break
              if not name:
                  raise SystemExit(f"workers.dev 주소 이름을 만들지 못함: {errs(r)} · {diag}. 토큰을 다시 만들 때 「계정 리소스」에서 계정을 고르세요")
          print(acc); print(name)
          PY
          if [ $? -ne 0 ]; then echo "준비 실패"; exit 1; fi
          export CLOUDFLARE_ACCOUNT_ID=$(sed -n 1p prep.out)
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.151.0 deploy > deploy.log 2>&1; rc=$?
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # 실패 까닭 몇 줄만(계정 ID는 가림) — 로그 전체는 남기지 않는다
          grep -E 'ERROR|✘|error' deploy.log | head -5 | sed "s/$CLOUDFLARE_ACCOUNT_ID/***/g" >> deploy_err.txt || true
          if [ $rc -ne 0 ]; then echo "배포 실패"; exit 1; fi
          if [ -n "$NARU_KEY" ]; then
            printf '%s' "$NARU_KEY" | npx --yes wrangler@4.151.0 secret put NARU_KEY > secret.log 2>&1 || { echo "키 넣기 실패" >> deploy_err.txt; exit 1; }
          else echo "정보나루 키 비밀값이 없어 중계가 503을 냅니다" >> deploy_err.txt; fi
      - name: 확인(/health · /holdings 1건)과 기록
        if: steps.deploy.outputs.skipped != 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, datetime, pathlib
          KST = datetime.timezone(datetime.timedelta(hours=9))
          url = os.environ.get("URL") or ""
          rec = {"time": datetime.datetime.now(KST).strftime("%Y-%m-%d %H:%M KST"),
                 "result": "ok" if os.environ.get("OUTCOME") == "success" else "fail", "url": url or None}
          err = pathlib.Path("relay/deploy_err.txt")
          if err.exists() and err.read_text().strip():
              rec["error"] = err.read_text().strip()[:600]
          def get(path, timeout):
              t0 = time.time()
              with urllib.request.urlopen(url + path, timeout=timeout) as r:
                  return json.load(r), round((time.time() - t0) * 1000)
          if url:
              for i in range(6):                       # 새 주소가 퍼질 때까지 잠깐 기다린다
                  try:
                      rec["health"], _ = get("/health", 20); break
                  except Exception as e:
                      rec["health"] = {"error": type(e).__name__}; time.sleep(10)
              try:
                  j, ms = get("/holdings?isbn=9788972756194", 90)
                  libs = j.get("libs", {})
                  rec["holdings_sample"] = {"isbn": "9788972756194", "ok": sum(v == "ok" for v in libs.values()),
                                            "busy": sum(v == "busy" for v in libs.values()), "none": sum(v == "none" for v in libs.values()),
                                            "calls": j.get("calls"), "asof": j.get("asof"), "ms": ms}
              except Exception as e:
                  rec["holdings_sample"] = {"error": f"{type(e).__name__}: {getattr(e, 'code', '')}"}
          pathlib.Path("relay/last_deploy.json").write_text(json.dumps(rec, ensure_ascii=False, indent=1), encoding="utf-8")
          print(json.dumps(rec, ensure_ascii=False))
          PY
          git config user.name "chaekiji-relay-deploy"
          git config user.email "relay@users.noreply.github.com"
          git add relay/last_deploy.json
          if ! git diff --cached --quiet; then git commit -m "중계 배포 기록 $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M')" && git pull --rebase -q origin main && git push; fi
      - name: 배포가 실패했으면 빨간 X로 알리기
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "중계 배포 실패 — relay/last_deploy.json 에 까닭이 있습니다"
          exit 1
